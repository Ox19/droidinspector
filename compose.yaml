# Builds aislados de macOS. Uso:
#   docker compose run --rm prepare   # con red: descarga dependencias y SDK, compila
#   docker compose run --rm verify    # sin red: lint, tests y APK reproducibles offline
# El metadata de checksums NO se regenera aquí: requiere caché de Gradle limpia, así que
# se genera en CI empujando una rama regen/<tema> (ver .github/workflows/regen-verification.yml).
# El único dato del host que ve el contenedor es esta carpeta del repo.
name: droidinspector

x-build: &build
  build:
    context: docker
    dockerfile: Dockerfile
  image: droidinspector-build:local
  platform: linux/amd64
  working_dir: /workspace
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - .:/workspace
    - gradle-home:/home/builder/.gradle
    - android-sdk:/opt/android-sdk
    # Mantiene estable el keystore de debug entre corridas: si cambia, el emulador
    # rechaza la reinstalación con INSTALL_FAILED_UPDATE_INCOMPATIBLE
    - android-home:/home/builder/.android
    # Archivos locales: vacíos dentro (local.properties apunta al SDK de macOS)
    - /dev/null:/workspace/local.properties:ro
    - /dev/null:/workspace/checklist-local.md:ro
  # El build no necesita historial git ni material interno
  tmpfs:
    - /workspace/.git
    - /workspace/.claude
    - /workspace/docs
  environment:
    ISOLATED_BUILD: "1"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"

services:
  prepare:
    <<: *build
    command: ["./gradlew", "lintDebug", "testDebugUnitTest", "assembleDebug"]

  verify:
    <<: *build
    network_mode: none
    command: ["./gradlew", "--offline", "--rerun-tasks", "lintDebug", "testDebugUnitTest", "assembleDebug"]

  # APK de release firmado. El keystore (keys/, ignorado por git y bloqueado en CI) se monta solo aquí.
  release:
    <<: *build
    volumes:
      - .:/workspace
      - gradle-home:/home/builder/.gradle
      - android-sdk:/opt/android-sdk
      - android-home:/home/builder/.android
      - ./keys:/keys:ro
      - /dev/null:/workspace/local.properties:ro
    command: ["./gradlew", "assembleRelease"]

  # Tests instrumentados contra el emulador que corre en el host. Docker Desktop hace de
  # puente hasta el adb del host, que sigue atado a 127.0.0.1: no se expone a la red.
  connected:
    <<: *build
    # El DeviceMonitor de AGP solo mira 127.0.0.1:5037 (ignora ADB_SERVER_SOCKET), así que
    # se reenvía ese puerto al adb del host, que además ya está autorizado por el emulador:
    # así no hace falta montar la clave privada adb de la máquina.
    entrypoint: ["bash", "-c"]
    command:
      - |
        socat TCP-LISTEN:5037,fork,reuseaddr TCP:host.docker.internal:5037 &
        adb wait-for-device
        ./gradlew connectedDebugAndroidTest; status=$$?
        # AGP devuelve éxito aunque la instalación falle y no se ejecute ningún test
        results=$$(find app/build/outputs/androidTest-results -name '*.xml' | head -1)
        if [ -z "$$results" ] || grep -q 'tests="0"' "$$results"; then
          echo "ERROR: no se ejecutó ningún test instrumentado"; exit 1
        fi
        grep -ohE 'tests="[0-9]+" [^>]*failures="[0-9]+"' "$$results"
        exit $$status


volumes:
  gradle-home:
  android-sdk:
  android-home:
