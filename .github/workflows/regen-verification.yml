name: Regenerar verification-metadata

# Uso: git push origin HEAD:refs/heads/regen/<tema>, bajar el artefacto, commitearlo y borrar la rama regen/*.
# Se genera en Linux porque en macOS faltan entradas que el runner sí resuelve.
on:
  push:
    branches: ["regen/**"]

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      # dependency-graph: generate hace que Gradle resuelva todas las configuraciones
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate
      - run: ./gradlew --write-verification-metadata sha256 lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
